[project]
name = "mnist-transformer"
version = "0.1.0"
description = "Transformer encoder for MNIST classification"
requires-python = ">=3.10"
dependencies = ["torch", "torchvision"]

# CPU-only PyTorch wheels (no GPU on this machine).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
